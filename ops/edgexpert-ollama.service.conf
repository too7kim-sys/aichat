# MSI EdgeXpert (NVIDIA DGX Spark, 128 GB unified memory) Ollama tuning.
#
# Drop this file at:
#   /etc/systemd/system/ollama.service.d/override.conf
#
# Then reload + restart:
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Verify the env got picked up:
#   systemctl show ollama -p Environment
#   ollama ps                              # check loaded models
#
# Rationale per knob:
#   OLLAMA_HOST=0.0.0.0:11434       Listen on LAN so the aichat backend on
#                                   another machine can reach it. Default
#                                   binds to 127.0.0.1 only.
#   OLLAMA_NUM_PARALLEL=4           Serve up to 4 concurrent generations.
#                                   The DGX Spark has the memory headroom
#                                   and lets multiple chat tabs / users
#                                   stream in parallel.
#   OLLAMA_MAX_LOADED_MODELS=2      Keep one coder + one reasoner hot at
#                                   the same time (e.g. qwen2.5-coder + r1)
#                                   so switching between them is instant.
#   OLLAMA_KEEP_ALIVE=24h           Don't unload models between requests.
#                                   With 128 GB unified memory there's
#                                   nothing to gain from evicting.
#   OLLAMA_FLASH_ATTENTION=1        Required for KV cache quantization
#                                   below, and dramatically faster on
#                                   Blackwell for long contexts.
#   OLLAMA_KV_CACHE_TYPE=q8_0       Quantize the KV cache to 8-bit, which
#                                   roughly halves its memory footprint
#                                   with negligible quality loss. Makes
#                                   128k contexts comfortable.
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_NUM_PARALLEL=4"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_KEEP_ALIVE=24h"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
