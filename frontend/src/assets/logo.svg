<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges" role="img" aria-label="Chat 로고">
  <title>Chat</title>
  <!-- Two interlocked pixel-art L-frames on a 12×12 grid; bars are 2
       units thick (~16%). Transparent background so the mark sits on
       any surface without a boxed look. -->
  <rect x="0" y="0" width="8" height="2" fill="#22A93A"/>
  <rect x="0" y="0" width="2" height="8" fill="#22A93A"/>
  <rect x="4" y="10" width="8" height="2" fill="#1E58B4"/>
  <rect x="10" y="4" width="2" height="8" fill="#1E58B4"/>
  <rect x="6" y="4" width="2" height="2" fill="#1B7A2C"/>
  <rect x="4" y="6" width="2" height="2" fill="#1B7A2C"/>
</svg>
