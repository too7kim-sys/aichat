<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges" role="img" aria-label="Chat 로고">
  <title>Chat</title>
  <!-- Two interlocked pixel-art L-frames on a 12×12 grid; bars are 4
       units thick (33%). Background is transparent: only the colored
       cells render, so the mark sits cleanly on any surface without a
       boxed look. -->
  <!-- Green L-frame, top-left -->
  <rect x="0" y="0" width="8" height="4" fill="#22A93A"/>
  <rect x="0" y="0" width="4" height="8" fill="#22A93A"/>
  <!-- Blue L-frame, bottom-right -->
  <rect x="4" y="8" width="8" height="4" fill="#1E58B4"/>
  <rect x="8" y="4" width="4" height="8" fill="#1E58B4"/>
  <!-- Dark-green hooks at the crossing: the visible bits of each
       ring's "back" piece that thread through the other -->
  <rect x="6" y="4" width="2" height="2" fill="#1B7A2C"/>
  <rect x="4" y="6" width="2" height="2" fill="#1B7A2C"/>
</svg>
