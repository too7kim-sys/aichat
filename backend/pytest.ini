[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 폐쇄망 빌드/CI 에서 외부 서비스(Ollama·Qdrant) 가 없어도 통과하도록
# 테스트 전반에서 그런 의존을 격리한다.  관련 마커 정의:
markers =
    ollama: 실제 Ollama 가 떠 있어야 동작하는 테스트 (CI 스킵 권장)
    qdrant: 실제 Qdrant 가 떠 있어야 동작하는 테스트
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # aiosqlite 백그라운드 thread 가 테스트 종료 시 닫힌 loop 에 접근 —
    # 응답은 이미 반환된 뒤라 테스트 결과엔 영향 없음.
    ignore::pytest.PytestUnhandledThreadExceptionWarning
